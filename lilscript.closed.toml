# closed LilScript world, level 13. With the one compiler no property is
# renamed in either lane, so extern class keys keep their names here too.
[javascript]
priority = "size-first"
optimization_level = 13
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "production"

[mangle]
identifiers = true
properties = true
pool_strings = true
